name: Daily Stock Data Refresh

# Runs every day at 6:00 AM UTC 
on:
  schedule:
    - cron: '0 6 * * *'

  # To tigger manual workflow
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh_data:
    runs-on: ubuntu-latest

    steps:

      # To check the repository for accessing the files
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install required libraries
      - name: Install dependencies
        run: |
          pip install yfinance pandas requests lxml

      # Run the data extraction script
      - name: Run stock data script
        run: |
          python fetch_top25_sp500.py

      # Save the updated CSVs back to GitHub
      - name: Commit and push updated CSVs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stock_prices.csv fundamentals.csv dim_stock.csv
          git diff --staged --quiet && echo "No changes to commit" || (git commit -m "Auto refresh — $(date '+%Y-%m-%d')" && git push)
