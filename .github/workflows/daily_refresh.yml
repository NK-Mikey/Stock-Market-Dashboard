name: Daily Stock Data Refresh

# Schedule the workflow to run automatically every day at 6:00 AM UTC
on:
  schedule:
    - cron: '0 6 * * *'

  # Allows manual trigger from the GitHub Actions tab without waiting for the schedule
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh_data:
    runs-on: ubuntu-latest

    steps:

      # Clone the repository into the virtual machine so the workflow can access and modify its files
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Set up the specified Python version on the virtual machine
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # Install required libraries
      - name: Install dependencies
        run: |
          pip install yfinance pandas requests lxml

      # Run the data extraction script
      - name: Run stock data script
        run: |
          python fetch_top25_sp500.py

      # Save the updated CSVs back to GitHub
      - name: Commit and push updated CSVs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stock_prices.csv data/fundamentals.csv data/dim_stock.csv
          git diff --staged --quiet && echo "No changes to commit" || (git commit -m "Auto refresh — $(date '+%Y-%m-%d')" && git push)
